<VirtualHost *:80>
    ServerName cheem-app.example.com
    DocumentRoot /var/www/cheem-app/web

    <Directory /var/www/cheem-app/web>
        AllowOverride All
        Require all granted
        Options -Indexes
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/cheem-error.log
    CustomLog ${APACHE_LOG_DIR}/cheem-access.log combined
</VirtualHost>
